spring.datasource.url=jdbc:h2:mem:notifications;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
authorization.jwt.secret=test-secret-for-notification-jwt-validation-at-least-64-bytes-long!!
# No RabbitMQ broker in the test environment; OrderEventsListener's handling logic is
# exercised directly in OrderEventsListenerTest with mocked collaborators.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
