spring.application.name=fuelbridge-ordering-service
spring.jpa.hibernate.naming.physical-strategy=com.halofuel.fuelbridge.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
spring.profiles.default=mysql
server.port=${PORT:8080}
authorization.jwt.secret=${AUTHORIZATION_JWT_SECRET}
authorization.jwt.expiration.days=7
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
documentation.application.version=@project.version@
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Standalone Inventory service (fuel products copied into requests and orders)
inventory.service.url=${INVENTORY_SERVICE_URL}
# Standalone Notification service (order confirmed, cancelled and dispatched)
notification.service.url=${NOTIFICATION_SERVICE_URL}
# Identity & Access (user of the buyer company that receives the notifications)
iam.service.url=${IAM_SERVICE_URL}
# Transactional outbox (T10.04b): relay period, retries and base delay of the exponential backoff
ordering.outbox.relay.enabled=${ORDERING_OUTBOX_RELAY_ENABLED:true}
ordering.outbox.relay.delay-ms=${ORDERING_OUTBOX_RELAY_DELAY_MS:2000}
ordering.outbox.max-attempts=${ORDERING_OUTBOX_MAX_ATTEMPTS:10}
ordering.outbox.retry-base-delay-ms=${ORDERING_OUTBOX_RETRY_BASE_DELAY_MS:2000}
