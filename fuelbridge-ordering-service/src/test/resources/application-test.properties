spring.datasource.url=jdbc:h2:mem:ordering;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
authorization.jwt.secret=test-secret-for-service-jwt-validation-at-least-64-bytes-long!!!!!!
inventory.service.url=http://127.0.0.1:9995
notification.service.url=http://127.0.0.1:9999
iam.service.url=http://127.0.0.1:9989
# Scenarios run the outbox relay explicitly and retry without waiting
ordering.outbox.relay.enabled=false
ordering.outbox.retry-base-delay-ms=0
