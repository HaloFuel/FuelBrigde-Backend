name: Azure - Container Image Validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/azure-image-validation.yml"
      - "fuelbridge-inventory-service/**"
      - "fuelbridge-shared-kernel/**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-inventory-image:
    name: Validate Inventory Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Inventory image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./fuelbridge-inventory-service/Dockerfile
          push: false
          tags: fuelbridge-inventory:validation
