# Railway (and any MySQL-compatible host) profile.
# Railway's managed MySQL plugin injects MYSQLHOST, MYSQLPORT, MYSQLDATABASE,
# MYSQLUSER and MYSQLPASSWORD automatically — no need to hardcode them.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:fuelbridge_platform}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Railway injects the port to bind to via $PORT.
server.port=${PORT:8080}
