name: fuelbridge-av4

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # FuelBridge Platform - Monolito residual
  platform:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: mysql
      PORT: "8080"

      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/fuelbridge_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"

      AUTHORIZATION_JWT_SECRET: ${AUTHORIZATION_JWT_SECRET:?Define AUTHORIZATION_JWT_SECRET en .env}

      NOTIFICATION_SERVICE_URL: http://notification:8080
      CATALOG_SERVICE_URL: http://catalog:8080
      REPORTING_SERVICE_URL: http://reporting:8080
      EQUIPMENT_SERVICE_URL: http://equipment:8080
      INVENTORY_SERVICE_URL: http://inventory:8080
      FULFILLMENT_SERVICE_URL: http://fulfillment:8080

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
